name: Build APK
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      # Works both when the project files are in the repo and when only LiveScreenTranslator.zip was uploaded.
      - name: Locate project
        id: proj
        run: |
          if [ -f LiveScreenTranslator.zip ]; then
            unzip -q LiveScreenTranslator.zip
            echo "dir=LiveScreenTranslator" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
 
      - uses: android-actions/setup-android@v3
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
 
      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace
 
      - name: Unit tests
        working-directory: ${{ steps.proj.outputs.dir }}
        continue-on-error: true
        run: gradle testDebugUnitTest
 
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
 
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: ${{ steps.proj.outputs.dir }}/app/build/reports/tests
          if-no-files-found: ignore
 
